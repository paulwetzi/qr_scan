<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrzeugkarte</title>
    <style>
        :root { --blue: #1980f6; --text: #1f2937; --muted: #6b7280; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #f3f4f6; }
        header { background: var(--blue); color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        header h1 { font-size: 20px; margin: 0; flex: 1; }
        header input { padding: 8px 10px; border-radius: 8px; border: 0; font-size: 15px; width: 220px; max-width: 100%; }
        main { max-width: 1000px; margin: 0 auto; padding: 16px; }
        .plan { position: relative; width: 100%; aspect-ratio: 952 / 956; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .plan img { width: 100%; height: 100%; display: block; }
        .car { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #e11d48; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
        .car.alt { background: #f59e0b; }
        .car.hit { width: 22px; height: 22px; margin: -11px 0 0 -11px; background: #16a34a; z-index: 2; }
        .tip { position: absolute; z-index: 3; background: rgba(17,24,39,.92); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 13px; transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; pointer-events: none; }
        .tip b { font-family: ui-monospace, Consolas, monospace; }
        .info { color: var(--muted); font-size: 14px; margin: 10px 2px; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
        .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>

<body>
    <header>
        <h1>Fahrzeugkarte</h1>
        <input id="search" type="search" placeholder="FIN suchen …" autocomplete="off">
    </header>
    <main>
        <div class="plan" id="plan">
            <img src="ims/gelaende.svg" alt="Geländeplan">
        </div>
        <p class="info legend">
            <span><i style="background:#e11d48"></i>heute gescannt</span>
            <span><i style="background:#f59e0b"></i>älter als 1 Tag</span>
            <span><i style="background:#16a34a"></i>Suchtreffer</span>
        </p>
        <p class="info" id="info">Lade Standorte …</p>
    </main>

    <script src="config.js?v=7"></script>
    <script src="ims/gelaende.js?v=1"></script>
    <script>
        const plan = document.getElementById("plan");
        let markers = [];
        let tip = null;

        function showTip(m, f) {
            if (tip) tip.remove();
            tip = document.createElement("div");
            tip.className = "tip";
            const when = f.zuletztGescannt ? new Date(f.zuletztGescannt).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "";
            tip.innerHTML = "<b></b><br><span></span>";
            tip.querySelector("b").textContent = f.fin;
            tip.querySelector("span").textContent = when + (f.genauigkeit ? " · ±" + f.genauigkeit + " m" : "");
            tip.style.left = m.style.left;
            const xp = parseFloat(m.style.left);
            tip.style.transform = "translate(" + (xp > 75 ? "-100%" : xp < 25 ? "0" : "-50%") + ", calc(-100% - 12px))";
            tip.style.top = m.style.top;
            plan.appendChild(tip);
        }

        async function load() {
            const cfg = window.QR_SCAN_CONFIG || {};
            const url = cfg.sheetUrl + "?token=" + encodeURIComponent(cfg.token || "");
            const data = await fetch(url).then((r) => r.json());
            if (!data.ok) throw new Error(data.error || "Fehler");

            let draussen = 0;
            const dayAgo = Date.now() - 24 * 3600 * 1000;
            data.fahrzeuge.forEach((f) => {
                if (f.latitude == null || f.longitude == null) return;
                const p = gpsZuPixel(f.latitude, f.longitude);
                if (!imPlan(p)) { draussen++; return; }
                const m = document.createElement("button");
                m.className = "car" + (Date.parse(f.zuletztGescannt) < dayAgo ? " alt" : "");
                m.style.left = (p.x / GELAENDE.breite * 100) + "%";
                m.style.top = (p.y / GELAENDE.hoehe * 100) + "%";
                m.title = f.fin;
                m.addEventListener("click", () => showTip(m, f));
                plan.appendChild(m);
                markers.push({ m, f });
            });
            document.getElementById("info").textContent =
                markers.length + " Fahrzeuge auf dem Gelände" + (draussen ? " · " + draussen + " außerhalb des Plans" : "");
        }

        document.getElementById("search").addEventListener("input", (e) => {
            const q = e.target.value.trim().toUpperCase();
            let first = null;
            markers.forEach(({ m, f }) => {
                const hit = q.length >= 3 && String(f.fin).toUpperCase().includes(q);
                m.classList.toggle("hit", hit);
                if (hit && !first) first = { m, f };
            });
            if (first) showTip(first.m, first.f);
            else if (tip) { tip.remove(); tip = null; }
        });

        load().catch((e) => { document.getElementById("info").textContent = "Standorte konnten nicht geladen werden: " + e.message; });
    </script>
</body>

</html>
