<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1980f6">
    <link rel="stylesheet" href="style.css?v=9">
    <title>Fahrzeug-Scanner</title>
</head>

<body>
    <div id="flash"></div>
    <div id="toast" hidden></div>

    <main class="container">
        <h1>Fahrzeug-Scanner</h1>

        <section id="gate" class="gate" hidden>
            <h2>Gerät freischalten</h2>
            <p id="gate-text">Dieses Gerät ist noch nicht freigegeben.</p>
            <div id="gate-form">
                <input id="gate-name" type="text" maxlength="60" placeholder="Dein Name, z. B. Max Mustermann">
                <button id="gate-btn" type="button">Freischaltung anfragen</button>
            </div>
            <p class="gate-id">Geräte-Code: <code id="gate-id"></code></p>
        </section>

        <div id="app" hidden>
        <div class="camera">
            <div id="reader"></div>
            <button id="btn-zoom" type="button" hidden>1×</button>
            <button id="btn-start" hidden>Kamera starten</button>
        </div>

        <p id="info" class="info"></p>

        <section class="history">
            <h2>Zuletzt gescannt</h2>
            <ul id="history"></ul>
        </section>
        </div>
    </main>

    <script src="config.js?v=9"></script>
    <script src="script.js?v=9"></script>
</body>

</html>
